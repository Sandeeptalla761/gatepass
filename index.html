<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TVL Gate Pass Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0f1419; --card:#1a2027; --line:#2a333d;
    --ink:#e8eaed; --dim:#9aa4b0;
    --ok:#34a853; --bad:#ea4335; --blue:#4285f4; --amber:#fbbc04;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;padding:12px;max-width:560px;background:var(--bg);
       color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,
       "Segoe UI",Roboto,sans-serif}
  h1{font-size:17px;margin:4px 0 14px}
  h1 span{color:var(--dim);font-weight:400;font-size:13px;display:block;margin-top:2px}

  .card{background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:14px;margin-bottom:12px}

  #reader{width:100%;border-radius:10px;overflow:hidden;background:#000}
  #reader video{width:100%!important;display:block}

  button{width:100%;padding:15px;border:0;border-radius:10px;
         font:600 16px inherit;color:#fff;background:var(--blue);
         margin-top:10px;cursor:pointer}
  button.grey{background:#5f6368}
  button.green{background:var(--ok)}
  button.amber{background:#b06000}
  button:active{opacity:.75}
  button:disabled{opacity:.4}

  input,textarea{width:100%;padding:12px;border-radius:9px;
    border:1px solid var(--line);background:#11161c;color:var(--ink);
    font:15px/1.4 inherit}
  textarea{min-height:70px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
  input.pin{font-size:24px;letter-spacing:9px;text-align:center}

  .status{padding:13px;border-radius:10px;margin-bottom:12px;
          display:none;border-left:4px solid}
  .status.on{display:block}
  .status.ok{background:rgba(52,168,83,.14);border-color:var(--ok)}
  .status.bad{background:rgba(234,67,53,.14);border-color:var(--bad)}
  .status.busy{background:rgba(66,133,244,.14);border-color:var(--blue)}
  .status b{display:block;font-size:16px;margin-bottom:4px}

  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;
       letter-spacing:.8px;margin-bottom:8px}

  .hdr{font-size:13px;line-height:1.6;margin-bottom:4px}
  .hdr .k{color:var(--dim);display:inline-block;min-width:78px}
  .gpno{font-size:20px;font-weight:700;margin-bottom:8px}

  .it{border-top:1px solid var(--line);padding:11px 0}
  .it:first-of-type{border-top:0}
  .it .nm{font-size:14px;margin-bottom:3px}
  .it .sub{color:var(--dim);font-size:12px}
  .it .ctl{display:flex;align-items:center;gap:9px;margin-top:8px}
  .it .ctl input[type=number]{width:82px;text-align:center;padding:9px}
  .it .ctl label{font-size:13px;color:var(--dim)}
  .it input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
  .it.done{opacity:.5}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;
        font-size:11px;font-weight:700}
  .pill.y{background:#fff2cc;color:#7f6000}
  .pill.r{background:#f4cccc;color:#990000}
  .pill.g{background:#d9ead3;color:#274e13}
  .pill.n{background:#efefef;color:#666}

  .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
       border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border-bottom:0}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:12px 0}
  .who{color:var(--dim);font-size:12px;margin-top:10px;text-align:right}
  .who a{color:var(--blue);text-decoration:none}
  .hide{display:none}
</style>
</head>
<body>

<h1>TVL Gate Pass Scanner
  <span>Returnable inventory &mdash; outward &amp; receipt</span></h1>

<div id="status" class="status"></div>

<!-- ============ 1. PIN ============ -->
<div id="gate" class="card">
  <div class="lbl">Enter PIN</div>
  <input id="pin" class="pin" type="tel" inputmode="numeric" maxlength="8"
         autocomplete="off" placeholder="&bull;&bull;&bull;&bull;">
  <div class="lbl" style="margin-top:14px">Your name</div>
  <input id="who" type="text" autocomplete="name" placeholder="e.g. Suresh Nayak">
  <button onclick="unlock()">Unlock</button>
</div>

<!-- ============ 2. SCAN ============ -->
<div id="scan" class="hide">
  <div class="card">
    <div id="reader"></div>
    <button id="btn" onclick="toggle()">Start camera</button>
  </div>
  <div class="card">
    <div class="lbl">Or type / paste the code</div>
    <textarea id="manual" placeholder="GP|260731|205|SUPPLIER|ITEM^6^PCS~ITEM^2^PCS|VEHICLE|260820"></textarea>
    <button onclick="submitManual()">Look up</button>
  </div>
  <div class="card">
    <div class="lbl">Recent gate passes</div>
    <div id="recent"><div class="empty">Loading&hellip;</div></div>
  </div>
  <div class="who">Scanning as <b id="whoLabel"></b> &middot;
    <a href="#" onclick="lock();return false;">change</a></div>
</div>

<!-- ============ 3. RETURNABLE / NON-RETURNABLE ============ -->
<div id="choose" class="hide">
  <div class="card">
    <div class="gpno">GATE PASS <span id="chGp"></span></div>
    <div id="chHdr"></div>
  </div>
  <div class="card">
    <div class="lbl">Is this material returnable?</div>
    <button class="green" onclick="chooseReturnable()">RETURNABLE</button>
    <button class="amber" onclick="chooseNonReturnable()">NON-RETURNABLE</button>
    <button class="grey" onclick="backToScan()">Cancel</button>
  </div>
</div>

<!-- ============ 4A. NEW OUTWARD ============ -->
<div id="outward" class="hide">
  <div class="card">
    <div class="gpno">GATE PASS <span id="oGp"></span></div>
    <div id="oHdr"></div>
  </div>
  <div class="card">
    <div class="lbl">Items going out</div>
    <div id="oItems"></div>
  </div>
  <div class="card">
    <button class="green" id="oSave" onclick="saveOut()">Save to sheet</button>
    <button class="grey" onclick="backToScan()">Cancel</button>
  </div>
</div>

<!-- ============ 4B. RECEIPT ============ -->
<div id="receipt" class="hide">
  <div class="card">
    <div class="gpno">GATE PASS <span id="rGp"></span></div>
    <div id="rHdr"></div>
  </div>
  <div class="card hide" id="rHistCard">
    <div class="lbl">Already received</div>
    <div id="rHist"></div>
  </div>
  <div class="card">
    <div class="lbl">Tick what has come back now</div>
    <div id="rItems"></div>
    <button class="grey" style="margin-top:14px" onclick="tickAll()">
      Select all outstanding</button>
  </div>
  <div class="card">
    <button class="green" id="rSave" onclick="saveReceipt()">Record receipt</button>
    <button class="grey" onclick="backToScan()">Cancel</button>
  </div>
</div>

<script>
/* ============================================================
   Apps Script web app URL (ending in /exec)
   ============================================================ */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxC2PLcTyniQ4u-aivhOQs67t1ReurvDG9J9BQRJKhGMGKatTYEudcwEu_RGt_ueEKjzA/exec';

var scanner=null, running=false, busy=false;
var lastCode='', lastAt=0;
var PIN='', WHO='';
var CURRENT=null;      // last lookup result
var PAYLOAD='';        // raw scanned text

/* ---------- server ----------
   Content-Type is left as text/plain so this stays a "simple"
   request. application/json would trigger a CORS preflight,
   which Apps Script cannot answer.                            */
function call(body){
  return fetch(ENDPOINT,{method:'POST',body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){ return r.json(); });
}

/* ---------- screens ---------- */
function show(id){
  ['gate','scan','choose','outward','receipt'].forEach(function(s){
    document.getElementById(s).className = (s===id) ? '' : 'hide';
  });
}

function backToScan(){
  CURRENT=null; PAYLOAD=''; lastCode='';
  document.getElementById('manual').value='';
  show('scan');
  say('busy','Ready','Tap Start camera and point at a gate pass QR.');
  loadRecent();
}

/* ---------- PIN ---------- */
function unlock(){
  var pin=document.getElementById('pin').value.trim();
  var who=document.getElementById('who').value.trim();
  if(!pin){ say('bad','Enter the PIN',''); return; }
  if(!who){ say('bad','Enter your name','Every entry records who scanned it.'); return; }

  say('busy','Checking\u2026','');
  call({action:'recent',pin:pin}).then(function(r){
    if(!r.ok){ say('bad','Wrong PIN','Ask the stores in-charge.'); return; }
    PIN=pin; WHO=who;
    document.getElementById('whoLabel').textContent=who;
    show('scan');
    renderRecent(r.rows||[]);
    say('busy','Ready','Tap Start camera and point at a gate pass QR.');
  }).catch(function(e){
    say('bad','Cannot reach the server', esc(String(e)));
  });
}

function lock(){
  stop(); PIN=''; WHO=''; CURRENT=null;
  document.getElementById('pin').value='';
  show('gate');
  document.getElementById('status').className='status';
}

/* ---------- camera ---------- */
function toggle(){ running?stop():start(); }

function start(){
  scanner = scanner || new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'},
    {fps:10,qrbox:{width:250,height:250}}, onScan, function(){})
  .then(function(){
    running=true;
    var b=document.getElementById('btn');
    b.textContent='Stop camera'; b.className='grey';
    say('busy','Camera on','Point at the QR code on the gate pass.');
  }).catch(function(e){
    say('bad','Cannot open the camera', esc(String(e)) +
        '<br>Allow camera access for this site, then try again.');
  });
}

function stop(){
  if(!scanner||!running) return;
  scanner.stop().then(function(){
    running=false;
    var b=document.getElementById('btn');
    b.textContent='Start camera'; b.className='';
  }).catch(function(){});
}

function onScan(text){
  var now=Date.now();
  if(text===lastCode && now-lastAt<4000) return;
  lastCode=text; lastAt=now;
  if(navigator.vibrate) navigator.vibrate(60);
  lookup(text);
}

function submitManual(){
  var v=document.getElementById('manual').value.trim();
  if(!v){ say('bad','Nothing to look up','Enter the code first.'); return; }
  lookup(v);
}

/* ---------- step 1: look up ---------- */
function lookup(payload){
  if(busy) return;
  busy=true;
  say('busy','Reading\u2026','');

  call({action:'lookup',pin:PIN,payload:payload}).then(function(r){
    busy=false;
    if(r.authFail){ lock(); say('bad','Session locked',esc(r.msg)); return; }
    if(!r.ok){
      if(navigator.vibrate) navigator.vibrate([120,80,120]);
      say('bad','Cannot read that code',esc(r.msg));
      lastCode='';
      return;
    }
    stop();
    CURRENT=r; PAYLOAD=payload;
    document.getElementById('chGp').textContent=r.gpNo;
    document.getElementById('chHdr').innerHTML=headerHtml(r);
    show('choose');
    say('busy', r.mode==='new' ? 'New gate pass' : 'Already in the sheet',
        r.mode==='new'
          ? 'Choose returnable or non-returnable.'
          : 'Choose RETURNABLE to record what has come back.');
  }).catch(function(e){
    busy=false;
    say('bad','Connection problem',esc(String(e))+'<br>Nothing was saved.');
    lastCode='';
  });
}

function headerHtml(r){
  return '<div class="hdr"><span class="k">Date</span>'+esc(r.date||'-')+'</div>'+
         '<div class="hdr"><span class="k">Supplier</span>'+esc(r.supplier||'-')+'</div>'+
         '<div class="hdr"><span class="k">Vehicle</span>'+esc(r.vehicle||'-')+'</div>'+
         '<div class="hdr"><span class="k">Due back</span><b>'+esc(r.due||'-')+'</b></div>';
}

/* ---------- step 2: the choice ---------- */
function chooseReturnable(){
  if(!CURRENT) return;
  if(CURRENT.mode==='new'){ showOutward(true); }
  else { showReceipt(); }
}

function chooseNonReturnable(){
  if(!CURRENT) return;
  if(CURRENT.mode==='new'){ showOutward(false); return; }
  say('bad','Already recorded',
      'Gate pass '+esc(CURRENT.gpNo)+' is in the sheet. To record a return, '+
      'choose RETURNABLE.');
}

/* ---------- 4A: new outward ---------- */
var OUT_RETURNABLE=true;

function showOutward(returnable){
  OUT_RETURNABLE=returnable;
  var r=CURRENT;
  document.getElementById('oGp').textContent=r.gpNo;
  document.getElementById('oHdr').innerHTML =
    headerHtml(r) +
    '<div style="margin-top:9px"><span class="pill '+(returnable?'y':'n')+'">'+
    (returnable?'RETURNABLE':'NON-RETURNABLE')+'</span></div>';

  document.getElementById('oItems').innerHTML = r.items.map(function(it,i){
    return '<div class="it"><div class="nm">'+(i+1)+'. '+esc(it.name)+'</div>'+
           '<div class="sub">Qty '+esc(it.qty)+' '+esc(it.uom)+'</div></div>';
  }).join('');

  document.getElementById('oSave').textContent =
    'Save '+r.items.length+' item'+(r.items.length>1?'s':'')+' to sheet';
  show('outward');
  say('busy','Check the details','Then save.');
}

function saveOut(){
  if(busy) return;
  busy=true;
  document.getElementById('oSave').disabled=true;
  say('busy','Saving\u2026','');

  call({action:'out',pin:PIN,by:WHO,payload:PAYLOAD,returnable:OUT_RETURNABLE})
  .then(function(r){
    busy=false;
    document.getElementById('oSave').disabled=false;
    if(r.authFail){ lock(); say('bad','Session locked',esc(r.msg)); return; }
    if(!r.ok){ say('bad','Not saved',esc(r.msg)); return; }
    if(navigator.vibrate) navigator.vibrate([50,60,50]);
    say('ok','Saved \u2014 GP '+esc(r.gpNo),
        r.count+' item row'+(r.count>1?'s':'')+' written from row '+r.firstRow+
        '<br>Status: <b>'+esc(r.status)+'</b>');
    setTimeout(backToScan,1800);
  }).catch(function(e){
    busy=false;
    document.getElementById('oSave').disabled=false;
    say('bad','Connection problem',esc(String(e))+'<br>Nothing was saved.');
  });
}

/* ---------- 4B: receipt ---------- */
function showReceipt(){
  var r=CURRENT;
  document.getElementById('rGp').textContent=r.gpNo;
  document.getElementById('rHdr').innerHTML=headerHtml(r);

  document.getElementById('rItems').innerHTML = r.rows.map(function(it,i){
    var done = it.balance<=0;
    return '<div class="it'+(done?' done':'')+'">'+
      '<div class="nm">'+(i+1)+'. '+esc(it.name)+'</div>'+
      '<div class="sub">Out '+it.out+' '+esc(it.uom)+
        ' &middot; back '+it.received+
        ' &middot; pending <b>'+it.balance+'</b> '+
        statusPill(it.status)+'</div>'+
      (done ? '' :
        '<div class="ctl">'+
        '<input type="checkbox" id="ck'+i+'" onchange="syncQty('+i+')">'+
        '<label for="ck'+i+'">Received</label>'+
        '<input type="number" id="qt'+i+'" min="1" max="'+it.balance+'" '+
               'value="'+it.balance+'" disabled>'+
        '<span class="sub">'+esc(it.uom)+'</span></div>')+
      '</div>';
  }).join('');

  var hc=document.getElementById('rHistCard');
  if(r.history && r.history.length){
    hc.className='card';
    document.getElementById('rHist').innerHTML = r.history.map(function(x){
      return '<div class="row"><div>'+esc(x.item).substring(0,34)+
             '<br><span style="color:#9aa4b0;font-size:12px">'+esc(x.by)+
             '</span></div><div style="text-align:right">+'+x.qty+
             '<br><span style="color:#9aa4b0;font-size:12px">'+esc(x.when)+
             '</span></div></div>';
    }).join('');
  } else {
    hc.className='card hide';
  }

  show('receipt');
  say('busy','Recording a return',
      'Part deliveries are fine \u2014 enter only what arrived today. '+
      'Scan again next time for the rest.');
}

function syncQty(i){
  document.getElementById('qt'+i).disabled =
    !document.getElementById('ck'+i).checked;
}

function tickAll(){
  CURRENT.rows.forEach(function(it,i){
    if(it.balance>0){
      document.getElementById('ck'+i).checked=true;
      syncQty(i);
    }
  });
}

function saveReceipt(){
  if(busy) return;

  var list=[];
  CURRENT.rows.forEach(function(it,i){
    if(it.balance<=0) return;
    var ck=document.getElementById('ck'+i);
    if(!ck || !ck.checked) return;
    var q=Number(document.getElementById('qt'+i).value);
    if(q>0) list.push({row:it.row, qty:Math.min(q,it.balance)});
  });

  if(!list.length){ say('bad','Nothing selected','Tick at least one item.'); return; }

  busy=true;
  document.getElementById('rSave').disabled=true;
  say('busy','Saving\u2026','');

  call({action:'receipt',pin:PIN,by:WHO,gpNo:CURRENT.gpNo,receipts:list})
  .then(function(r){
    busy=false;
    document.getElementById('rSave').disabled=false;
    if(r.authFail){ lock(); say('bad','Session locked',esc(r.msg)); return; }
    if(!r.ok){ say('bad','Not saved',esc(r.msg)); return; }
    if(navigator.vibrate) navigator.vibrate([50,60,50]);
    say('ok','Receipt recorded \u2014 GP '+esc(r.gpNo),
        r.updated+' line'+(r.updated>1?'s':'')+' updated \u00b7 '+
        r.complete+' fully back'+
        (r.partial ? ' \u00b7 '+r.partial+' still part-pending' : ''));
    setTimeout(backToScan,1800);
  }).catch(function(e){
    busy=false;
    document.getElementById('rSave').disabled=false;
    say('bad','Connection problem',esc(String(e))+'<br>Nothing was saved.');
  });
}

/* ---------- recent ---------- */
function loadRecent(){
  call({action:'recent',pin:PIN})
    .then(function(r){ renderRecent(r.rows||[]); })
    .catch(function(){});
}

function renderRecent(rows){
  var el=document.getElementById('recent');
  if(!rows.length){ el.innerHTML='<div class="empty">No entries yet</div>'; return; }
  el.innerHTML=rows.map(function(r){
    return '<div class="row"><div><b>GP '+esc(r.gpNo)+'</b><br>'+
      '<span class="sub" style="color:#9aa4b0;font-size:12px">'+
      esc(String(r.supplier).substring(0,28))+'</span></div>'+
      '<div style="text-align:right">'+statusPill(r.status)+'<br>'+
      '<span style="color:#9aa4b0;font-size:12px">'+r.done+'/'+r.lines+
      ' back</span></div></div>';
  }).join('');
}

function statusPill(s){
  s=String(s||'');
  var c = s.indexOf('RECEIVED')===0 ? 'g'
        : s.indexOf('DUE FOR')===0  ? 'r'
        : s.indexOf('NOT DUE')===0  ? 'y'
        : s.indexOf('NON-')===0     ? 'n' : '';
  return c ? '<span class="pill '+c+'">'+esc(s)+'</span>' : '';
}

/* ---------- helpers ---------- */
function say(kind,title,detail){
  var el=document.getElementById('status');
  el.className='status on '+kind;
  el.innerHTML='<b>'+title+'</b>'+(detail||'');
}

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('pin').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('who').focus();
});
document.getElementById('who').addEventListener('keydown',function(e){
  if(e.key==='Enter') unlock();
});
</script>
</body>
</html>
